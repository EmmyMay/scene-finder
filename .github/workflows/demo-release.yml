name: Publish demo downloads
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Desktop builds run ID
        required: true
        type: string
      tag:
        description: New prerelease tag
        required: true
        default: v1.0.0-demo.1
        type: string
permissions:
  actions: read
  contents: write
concurrency:
  group: demo-release-${{ inputs.tag }}
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RUN_ID: ${{ inputs.run_id }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - name: Verify the source build was successful and merged
        id: source
        shell: bash
        run: |
          [[ "$RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-demo\.[0-9]+$ ]]
          gh api "repos/$GH_REPO/actions/runs/$RUN_ID" > run.json
          jq -e --arg repo "$GH_REPO" '.name == "Desktop builds" and .status == "completed" and .conclusion == "success" and .head_repository.full_name == $repo' run.json
          revision=$(jq -r .head_sha run.json)
          git merge-base --is-ancestor "$revision" HEAD
          echo "revision=$revision" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
          pattern: Scene-Finder-*
          merge-multiple: true
          path: downloads
      - name: Verify the download set and publish the prerelease
        shell: bash
        env:
          SOURCE_REVISION: ${{ steps.source.outputs.revision }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          expected = {'Scene-Finder-darwin-arm64.tar.gz', 'Scene-Finder-win32-x64.tar.gz', 'Scene-Finder-linux-x64.tar.gz'}
          assert {p.name for p in Path('downloads').iterdir()} == expected, 'Expected all three platform archives'
          PY
          (cd downloads && sha256sum ./*.tar.gz > SHA256SUMS.txt)
          cat > release-notes.md <<'NOTES'
          Demo builds for macOS Apple silicon, Windows x64, and Linux x64. Omarchy is best effort.

          Extract the archive and open Scene Finder from its folder. Connect your Jev key in Settings, load an MKV or MP4, describe a visible moment, then seek, trim and export a clip.

          These are unsigned demo builds (ad-hoc signed on macOS), not notarized installers. Native media checks, tests and packaging passed on all three operating systems; hands-on app verification was performed on macOS.

          Movies remain local. Search sends sampled frames to Jev. Matching times are approximate. Media source archives, build instructions and license notices are included inside each package.
          NOTES
          gh release create "$RELEASE_TAG" downloads/* --target "$SOURCE_REVISION" --prerelease --title "Scene Finder $RELEASE_TAG" --notes-file release-notes.md
